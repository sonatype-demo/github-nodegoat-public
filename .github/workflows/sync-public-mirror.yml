name: Sync public mirror

on:
  push:
    branches: [sonatype]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public-mirror
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: sonatype-demo/github-nodegoat-public

jobs:
  sync:
    name: Mirror sonatype branch
    runs-on: [self-hosted, sonatype-demo, pve, docker]
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v7
        with:
          ref: sonatype
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git authentication for the public mirror
        env:
          MIRROR_TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
          ASKPASS_PATH: ${{ runner.temp }}/github-nodegoat-public-askpass
        run: |
          if [[ -z "$MIRROR_TOKEN" ]]; then
            echo "PUBLIC_MIRROR_TOKEN is not configured" >&2
            exit 1
          fi
          umask 077
          {
            echo '#!/usr/bin/env bash'
            echo 'case "$1" in'
            echo '  *Username*) printf '\''%s\n'\'' '\''x-access-token'\'' ;;'
            echo '  *Password*) printf '\''%s\n'\'' "$MIRROR_TOKEN" ;;'
            echo '  *) exit 1 ;;'
            echo 'esac'
          } > "$ASKPASS_PATH"
          chmod 700 "$ASKPASS_PATH"

      - name: Publish the current sonatype tree to the public repository
        env:
          MIRROR_TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
          GIT_ASKPASS: ${{ runner.temp }}/github-nodegoat-public-askpass
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if git remote get-url public >/dev/null 2>&1; then
            git remote set-url public "https://github.com/${TARGET_REPOSITORY}.git"
          else
            git remote add public "https://github.com/${TARGET_REPOSITORY}.git"
          fi
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          target_sha=""

          if git fetch --no-tags public refs/heads/sonatype; then
            target_sha="$(git rev-parse FETCH_HEAD)"
            target_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
            if [[ "$source_tree" == "$target_tree" ]]; then
              echo "Public mirror already has the current source tree"
              exit 0
            fi
          fi

          export GIT_AUTHOR_NAME='sonatype-demo mirror'
          export GIT_AUTHOR_EMAIL='sonatype-demo@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          if [[ -n "$target_sha" ]]; then
            mirror_commit="$(
              printf 'Mirror source sonatype tree at %s\n' "$source_sha" |
                git commit-tree "$source_tree" -p "$target_sha"
            )"
          else
            mirror_commit="$(
              printf 'Initial mirror of source sonatype tree at %s\n' "$source_sha" |
                git commit-tree "$source_tree"
            )"
          fi

          git push --force public "$mirror_commit:refs/heads/sonatype"

      - name: Remove temporary Git authentication
        if: always()
        env:
          ASKPASS_PATH: ${{ runner.temp }}/github-nodegoat-public-askpass
        run: |
          git remote remove public 2>/dev/null || true
          rm -f "$ASKPASS_PATH"
